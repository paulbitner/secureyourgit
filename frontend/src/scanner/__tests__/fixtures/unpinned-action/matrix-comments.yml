on: push
jobs:
  test:
    strategy:
      matrix:
        node: [18, 20, 22]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # - uses: some-org/commented-out@v1
      - uses: actions/setup-node@v4   # inline comment
        with:
          node-version: ${{ matrix.node }}
